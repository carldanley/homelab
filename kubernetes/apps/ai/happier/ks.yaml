---
# Source-only stages remain suspended pending operator acceptance.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-database
  namespace: ai
spec:
  suspend: true
  interval: 1h
  path: ./kubernetes/apps/ai/happier/database
  prune: true
  targetNamespace: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier
  namespace: ai
spec:
  suspend: true
  interval: 1h
  path: ./kubernetes/apps/ai/happier/app
  prune: true
  targetNamespace: ai
  dependsOn:
    - name: happier-migration
    - name: happier-redis
    - name: happier-bucket
  postBuild:
    substituteFrom:
      - kind: Secret
        name: domains-secret
        optional: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-bucket
  namespace: ai
spec:
  dependsOn:
    - name: rook-ceph-object-store
      namespace: rook-ceph
  healthChecks:
    - apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      name: happier-files
      namespace: ai
  healthCheckExprs:
    - apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      inProgress: '!has(status.phase) || status.phase == "Pending"'
      failed: has(status.phase) && status.phase in ['Released', 'Failed']
      current: has(status.phase) && status.phase == 'Bound'
  interval: 1h
  path: ./kubernetes/apps/ai/happier/bucket
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-redis
  namespace: ai
spec:
  suspend: true
  interval: 1h
  path: ./kubernetes/apps/ai/happier/redis
  prune: true
  targetNamespace: ai
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-credentials
  namespace: ai
spec:
  suspend: true
  interval: 1h
  path: ./kubernetes/apps/ai/happier/credentials
  prune: true
  targetNamespace: ai
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-migration
  namespace: ai
spec:
  suspend: true
  interval: 1h
  path: ./kubernetes/apps/ai/happier/migration
  prune: true
  targetNamespace: ai
  dependsOn:
    - name: happier-database
    - name: happier-credentials
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: happier-migration
      namespace: ai
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
