apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-redis
  namespace: ai
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/happier/redis
  prune: true
  targetNamespace: ai
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
