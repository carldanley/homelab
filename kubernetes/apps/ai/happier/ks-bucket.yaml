apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-bucket
  namespace: ai
spec:
  dependsOn:
    - name: rook-ceph-object-store
      namespace: rook-ceph
  healthChecks:
    - apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      name: happier-files
      namespace: ai
  healthCheckExprs:
    - apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      inProgress: '!has(status.phase) || status.phase == "Pending"'
      failed: has(status.phase) && status.phase in ['Released', 'Failed']
      current: has(status.phase) && status.phase == 'Bound'
  interval: 1h
  path: ./kubernetes/apps/ai/happier/bucket
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: true
