apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-credentials
  namespace: ai
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/happier/credentials
  prune: true
  targetNamespace: ai
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
