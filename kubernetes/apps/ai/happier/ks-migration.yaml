apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-migration
  namespace: ai
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/happier/migration
  prune: true
  targetNamespace: ai
  dependsOn:
    - name: happier-database
    - name: happier-credentials
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: happier-migrate-fc8c6c32
      namespace: ai
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
