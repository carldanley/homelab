apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: happier-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: happier-proxy
  ingress:
    # Existing Cilium Gateway policies use this reserved ingress identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/instance: happier
            k8s:app.kubernetes.io/controller: api
      toPorts:
        - ports:
            - port: "3005"
              protocol: TCP
            - port: "9090"
              protocol: TCP
