apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: happier
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  hostnames:
    - "happier.${DOMAIN_5}"
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: domain-5-subdomain-https
  rules:
    - timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: happier-proxy
          port: 8080
