apiVersion: apps/v1
kind: Deployment
metadata:
  name: happier-proxy
  annotations:
    configmap.reloader.stakater.com/reload: happier-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: happier-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: happier-proxy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        fsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: happier-proxy
      containers:
        - name: haproxy
          image: public.ecr.aws/docker/library/haproxy:3.4.7-alpine@sha256:5312d37032c079c4937d45ef63758852434351f3b425a3703521fd999837abcf
          args:
            - -W
            - -db
            - -f
            - /usr/local/etc/haproxy/haproxy.cfg
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /proxy-health
              port: http
          readinessProbe:
            httpGet:
              path: /proxy-ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: happier-proxy
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
