---
apiVersion: v1
kind: ConfigMap
metadata:
  name: happier-proxy
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      maxconn 4096
    defaults
      mode http
      log global
      option httplog
      option dontlognull
      timeout connect 5s
      timeout client 1h
      timeout server 1h
      timeout tunnel 1h
      timeout http-request 30s
      timeout http-keep-alive 15s
      timeout check 5s
    resolvers kubernetes
      parse-resolv-conf
      accepted_payload_size 8192
      resolve_retries 3
      timeout resolve 1s
      timeout retry 1s
      hold valid 5s
      hold obsolete 5s
      hold nx 2s
      hold refused 2s
      hold timeout 2s
      hold other 2s
    frontend http
      bind :8080
      http-request return status 200 content-type text/plain string ok if { path -i /proxy-health }
      http-request return status 200 content-type text/plain string ready if { path -i /proxy-ready } { nbsrv(api) gt 0 }
      http-request return status 503 content-type text/plain string unavailable if { path -i /proxy-ready }
      # Decode before routing so encoded separators cannot bypass the files policy.
      http-request set-var(txn.files_path) path,url_dec
      acl files_path var(txn.files_path) -m reg -i ^/files(/|$)
      http-request set-header X-Forwarded-Proto https
      use_backend files if files_path
      default_backend api
    backend files
      # Shared internal/VPN read access, not per-user authorization.
      http-request deny deny_status 403 unless { method GET HEAD }
      http-request deny deny_status 403 if { var(txn.files_path) -m reg /$ }
      http-request deny deny_status 403 if { var(txn.files_path) -m str -i /files }
      # Deny directory HTML before any response reaches the client, including
      # normalized/encoded directory requests that evade the early path checks.
      http-response deny deny_status 403 if { res.hdr(Content-Type) -m beg -i text/html }
      server reader happier-files.ai.svc.cluster.local:8080 check resolvers kubernetes resolve-prefer ipv4 init-addr none
    backend api
      balance roundrobin
      option redispatch
      cookie SRV insert indirect nocache dynamic httponly secure attr SameSite=Lax
      # Public routing salt, not an authentication secret; identical on both replicas.
      dynamic-cookie-key happier-api-routing-v1
      option httpchk
      http-check connect port 9090
      http-check send meth GET uri /ready ver HTTP/1.1 hdr Host localhost
      http-check expect status 200
      # Do not enable allow-dup-ip: each slot must represent a distinct API pod.
      server-template api 4 happier-api-headless.ai.svc.cluster.local:3005 check inter 5s fall 3 rise 2 resolvers kubernetes resolve-prefer ipv4 init-addr none
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: happier-proxy
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: happier-proxy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: happier-proxy}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        fsGroup: 99
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: happier-proxy}
      containers:
        - name: haproxy
          image: public.ecr.aws/docker/library/haproxy:3.3.10-alpine@sha256:29c775f541ba6364ac95de998a8d3d16eb4882470c4fd7bbe8de8315edfdd883
          args: [-W, -db, -f, /usr/local/etc/haproxy/haproxy.cfg]
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          livenessProbe:
            httpGet: {path: /proxy-health, port: http}
          readinessProbe:
            httpGet: {path: /proxy-ready, port: http}
          volumeMounts:
            - {name: config, mountPath: /usr/local/etc/haproxy, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: happier-proxy}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: happier-proxy
spec:
  selector: {app.kubernetes.io/name: happier-proxy}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: happier-api-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: happier
    app.kubernetes.io/controller: api
  ports:
    - {name: http, port: 3005, targetPort: 3005}
    - {name: health, port: 9090, targetPort: 9090}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: happier-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: happier-proxy}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: happier
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  hostnames: ["happier.${DOMAIN_5}"]
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: domain-5-subdomain-https
  rules:
    - timeouts: {request: 0s, backendRequest: 0s}
      backendRefs: [{name: happier-proxy, port: 8080}]
