# No per-user authorization: the internal/VPN boundary grants object read access.
# rclone's directory HTML is blocked by HAProxy; only the proxy may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: happier-files
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: happier-files
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: happier-proxy
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
          podSelector:
            matchLabels:
              app: rook-ceph-rgw
              rook_object_store: internal-cache
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
