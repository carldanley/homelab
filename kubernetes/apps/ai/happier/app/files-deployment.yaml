apiVersion: apps/v1
kind: Deployment
metadata:
  name: happier-files
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: happier-files
  template:
    metadata:
      labels:
        app.kubernetes.io/name: happier-files
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: happier-files
      containers:
        - name: rclone
          image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
          args:
            - serve
            - http
            - 'bucket:$(BUCKET_NAME)'
            - --read-only
            - --baseurl
            - /files
            - --addr
            - ':8080'
          envFrom:
            - configMapRef:
                name: happier-files
            - secretRef:
                name: happier-files
          env:
            - name: RCLONE_CONFIG
              value: /dev/null
            - name: RCLONE_CONFIG_BUCKET_TYPE
              value: s3
            - name: RCLONE_CONFIG_BUCKET_PROVIDER
              value: Ceph
            - name: RCLONE_CONFIG_BUCKET_ENV_AUTH
              value: 'true'
            - name: RCLONE_CONFIG_BUCKET_REGION
              value: us-east-1
            - name: RCLONE_CONFIG_BUCKET_ENDPOINT
              value: 'http://$(BUCKET_HOST):$(BUCKET_PORT)'
            - name: RCLONE_CONFIG_BUCKET_FORCE_PATH_STYLE
              value: 'true'
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
