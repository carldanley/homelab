---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: happier-proxy
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: happier-proxy}
  ingress:
    # Existing Cilium Gateway policies use this reserved ingress identity.
    - fromEntities: [ingress]
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/instance: happier
            k8s:app.kubernetes.io/controller: api
      toPorts:
        - ports: [{port: "3005", protocol: TCP}, {port: "9090", protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: happier-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: happier
      app.kubernetes.io/controller: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: happier-proxy}
      ports: [{port: 3005, protocol: TCP}, {port: 9090, protocol: TCP}]
---
# Cluster-scoped so the app's namespace transformer cannot relocate this rule.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: happier-coder-private-egress
specs:
  - endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: coder-workspaces
        k8s:app.kubernetes.io/name: coder-workspace
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: ai
              k8s:app.kubernetes.io/name: happier-proxy
        toPorts:
          - ports: [{port: "8080", protocol: TCP}]
  - endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: homelab-workspaces
        k8s:app.kubernetes.io/name: homelab-workspace
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: ai
              k8s:app.kubernetes.io/name: happier-proxy
        toPorts:
          - ports: [{port: "8080", protocol: TCP}]
