---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: happier
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      api:
        replicas: 2
        strategy: RollingUpdate
        containers:
          app: &app
            image:
              repository: ghcr.io/happier-dev/relay-server
              tag: cli-v0.2.20@sha256:fc8c6c326f1fa43d98005d0410dd1f5ecedd7cf2290c232f9ff4072e58690560
            env: &env
              HAPPIER_SERVER_FLAVOR: full
              HAPPIER_DB_PROVIDER: postgres
              RUN_MIGRATIONS: "0"
              SERVER_ROLE: api
              HAPPIER_SOCKET_ADAPTER: redis-streams
              METRICS_ENABLED: "true"
              METRICS_PORT: "9090"
              PORT: "3005"
              S3_REGION: us-east-1
              S3_USE_SSL: "false"
              # File publication route must be completed before unsuspending.
              S3_PUBLIC_URL: https://happier.${DOMAIN_5}/files
              S3_HOST:
                valueFrom:
                  configMapKeyRef: {name: happier-files, key: BUCKET_HOST}
              S3_PORT:
                valueFrom:
                  configMapKeyRef: {name: happier-files, key: BUCKET_PORT}
              S3_BUCKET:
                valueFrom:
                  configMapKeyRef: {name: happier-files, key: BUCKET_NAME}
              S3_ACCESS_KEY:
                valueFrom:
                  secretKeyRef: {name: happier-files, key: AWS_ACCESS_KEY_ID}
              S3_SECRET_KEY:
                valueFrom:
                  secretKeyRef: {name: happier-files, key: AWS_SECRET_ACCESS_KEY}
            envFrom:
              - secretRef: {name: happier-secret}
            ports:
              - {name: http, containerPort: 3005}
            probes:
              liveness: &health
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: 9090}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /ready, port: 9090}
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                <<: *health
                spec:
                  httpGet: {path: /health, port: 9090}
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {memory: 1Gi}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
      worker:
        replicas: 1
        containers:
          app:
            <<: *app
            env:
              <<: *env
              SERVER_ROLE: worker
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: happier
    service:
      api:
        controller: api
        ports:
          http: {port: 3005}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: happier-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: happier
      app.kubernetes.io/controller: api
