apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier-database
  namespace: ai
spec:
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: databases
  wait: true
  timeout: 5m
  interval: 1h
  path: ./kubernetes/apps/ai/happier/database/schema
  prune: true
  targetNamespace: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
