apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: happier-redis
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: happier-redis-secret
  data:
    - secretKey: password
      remoteRef:
        key: happier
        property: REDIS_PASSWORD
