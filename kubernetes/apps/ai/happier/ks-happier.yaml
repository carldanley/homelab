apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier
  namespace: ai
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/happier/app
  prune: true
  targetNamespace: ai
  dependsOn:
    - name: happier-migration
    - name: happier-redis
    - name: happier-bucket
  postBuild:
    substituteFrom:
      - kind: Secret
        name: domains-secret
        optional: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
