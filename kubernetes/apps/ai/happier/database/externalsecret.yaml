---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: happier-database
  namespace: databases
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: happier-database-secret
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: happier
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: happier
        property: POSTGRES_PASSWORD
