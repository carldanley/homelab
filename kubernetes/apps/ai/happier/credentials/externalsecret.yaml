apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: happier
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: happier-secret
    template:
      engineVersion: v2
      data:
        HANDY_MASTER_SECRET: "{{ .SERVER_MASTER_SECRET }}"
        DATABASE_URL: 'postgresql://happier:{{ .POSTGRES_PASSWORD | urlquery | replace "+" "%20" }}@postgres-rw.databases.svc.cluster.local:5432/happier?connection_limit=5'
        REDIS_URL: 'redis://:{{ .REDIS_PASSWORD | urlquery | replace "+" "%20" }}@happier-redis.ai.svc.cluster.local:6379/0'
  data:
    - secretKey: SERVER_MASTER_SECRET
      remoteRef:
        key: happier
        property: SERVER_MASTER_SECRET
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: happier
        property: POSTGRES_PASSWORD
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: happier
        property: REDIS_PASSWORD
