---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      app:
        replicas: 1
        strategy: Recreate
        annotations:
          configmap.reloader.stakater.com/reload: hermes-config
          secret.reloader.stakater.com/reload: hermes-secret
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.22.7@sha256:e6d81ae52ebf6a43efa529701405509f20054ba818f179ddd748bed4f8af584c
            args:
              - gateway
              - run
            env:
              TZ: America/New_York
              HERMES_HOME: /opt/data
              HERMES_CONFIG_BACKEND: file
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: "0.0.0.0"
              HERMES_DASHBOARD_PORT: &port 9119
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.${DOMAIN_5}"
              API_SERVER_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: hermes-secret
            ports:
              - name: http
                containerPort: *port
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python3
                      - -c
                      - |
                        import json
                        import urllib.request

                        with urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=3) as response:
                            status = json.load(response)
                        raise SystemExit(0 if status.get('auth_required') and 'basic' in status.get('auth_providers', []) else 1)
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python3
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=3).close()"
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - python3
                      - -c
                      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=3).close()"
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            # The official image starts s6 as root, then runs Hermes as UID 10000.
            # Keep its entrypoint: it seeds skills and supervises both services.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - NET_RAW
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 4Gi

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostUsers: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: app
        ports:
          http:
            port: *port

    route:
      internal:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://hermes.${DOMAIN_5}/api/status
            conditions:
              - "[STATUS] == 200"
              - "[BODY].gateway_running == true"
            ui:
              hide-hostname: true
              hide-port: true
              hide-url: true
        hostnames:
          - "hermes.${DOMAIN_5}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: domain-5-subdomain-https
        rules:
          - timeouts:
              request: 0s
            backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-config
        globalMounts:
          - path: /etc/hermes/config.yaml
            subPath: config.yaml
            readOnly: true
