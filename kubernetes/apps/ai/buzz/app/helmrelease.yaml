---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buzz
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: buzz
    namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: buzz-secret
      valuesKey: BUZZ_OWNER_PUBKEY
      targetPath: ownerPubkey
  values:
    # pinned to main digest: released images (<=0.2.0) lack mobile pairing
    # support (BUZZ_PAIRING_RELAY_URL + buzz-pair-relay binary). Keep in sync
    # with helmrelease-pairing.yaml; move to the next semver release when it
    # ships pairing. Forward-only: main's migrations preclude rollback to 0.2.0.
    image:
      repository: ghcr.io/block/buzz
      tag: main@sha256:d9b19c6d19c6af601a81d711b7f95ac2fcb7955cdde726d1432ede685aa6772f

    relayUrl: "wss://buzz.${DOMAIN_5}"

    secrets:
      existingSecret: buzz-secret

    s3:
      endpoint: https://d09aa6ad2c849681b113b8dbb5cd3820.r2.cloudflarestorage.com
      bucket: batcave-buzz-media

    relay:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: null
          memory: 2Gi
      extraEnv:
        - name: BUZZ_S3_REGION
          value: auto

    extraInitContainers:
      - name: init-db
        image: ghcr.io/home-operations/postgres-init:18
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: buzz-secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    persistence:
      git:
        enabled: true
        storageClass: ceph-block
        size: 10Gi

    pairingRelay:
      # chart deployment disabled: no released image ships buzz-pair-relay yet
      # (Dockerfile only builds it on main); we run it via helmrelease-pairing.yaml.
      # When a relay release includes the binary: enable this and drop that file.
      enabled: false
      url: "wss://buzz-pair.${DOMAIN_5}"

    httproute:
      enabled: true
      hostnames:
        - "buzz.${DOMAIN_5}"
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: domain-5-subdomain-https
        - name: buzz-direct
          namespace: kube-system
          sectionName: domain-5-subdomain-https

    serviceMonitor:
      enabled: true
