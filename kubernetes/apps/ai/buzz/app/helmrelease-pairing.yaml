---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buzz-pairing
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      buzz-pairing:
        containers:
          app:
            image:
              repository: ghcr.io/block/buzz
              tag: main@sha256:ee3264f4c578b94caea5fa26ab2abfb7e8ca37c6e7264717b0f1d58879973916
            command:
              - /usr/local/bin/buzz-pair-relay
            env:
              BUZZ_PAIR_RELAY_BIND_ADDR: 0.0.0.0:5000
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5000
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      hostUsers: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

    service:
      buzz-pairing:
        controller: buzz-pairing
        ports:
          websocket:
            port: 5000
