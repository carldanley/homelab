---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uxi-nats-secrets
  namespace: uxi-nats
spec:
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
    - name: reflector
      namespace: kube-system
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/uxi/nats/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: uxi-nats
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uxi-nats
  namespace: uxi-nats
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: nats
  dependsOn:
    - name: uxi-nats-secrets
      namespace: uxi-nats
    - name: kube-prometheus-stack
      namespace: observability
    - name: grafana-operator
      namespace: observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: nats
      namespace: uxi-nats
  interval: 1h
  path: ./kubernetes/apps/uxi/nats/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: uxi-nats
