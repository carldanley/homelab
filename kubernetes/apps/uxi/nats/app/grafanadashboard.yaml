---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: uxi-nats
spec:
  uid: uxi-nats
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    # The upstream dashboard substitutes this input into datasource.uid.
    - datasourceName: prometheus
      inputName: DS__NATS-PROMETHEUS
  # The Helm variant uses the same nats_* metric prefix as the chart's exporter.
  url: https://raw.githubusercontent.com/nats-io/prometheus-nats-exporter/v0.20.1/walkthrough/grafana-nats-dash-helm.json
  # Reuse the Unbound folder and its existing unbound-gms viewing permissions.
  folderUID: unbound-dashboards
