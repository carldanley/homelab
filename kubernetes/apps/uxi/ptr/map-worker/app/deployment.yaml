---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uxi-ptr-worker
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uxi-ptr-server
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uxi-ptr-server
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        gpu.homelab/amd: 'true'
      containers:
        - name: worker
          image: git.r1p.dev/unbound-xi/server-worker:v0.11.0@sha256:d27e071062e7197bae896a81dd4db172d90e7c63cd52375078074f34456adbb0
          imagePullPolicy: IfNotPresent
          command:
            - unbound-worker
          args:
            - serve
          env:
            - name: UNBOUND_CONFIG
              value: /config/config.toml
            - name: UNBOUND_LOG_FORMAT
              value: json
            - name: RUST_LOG
              value: info
          ports:
            - name: health
              containerPort: 21019
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              memory: 12Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: nats
              mountPath: /secrets/nats
              readOnly: true
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: uxi-ptr-worker-config
        - name: nats
          secret:
            secretName: uxi-ptr-nats
            items:
              - key: NATS_PASSWORD
                path: password
  strategy:
    type: Recreate
