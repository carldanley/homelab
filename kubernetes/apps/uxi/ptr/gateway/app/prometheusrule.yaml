---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uxi-ptr-gateway
spec:
  groups:
    - name: uxi-ptr-gateway
      rules:
        - alert: UnboundXiPtrGatewayReplicaUnavailable
          expr: kube_statefulset_status_replicas_ready{namespace="uxi-ptr",statefulset="uxi-ptr-gateway"} < 3
          for: 10m
          labels:
            severity: warning
            discord_channel: homelab-alerts
          annotations:
            summary: UnboundXI PTR gateway redundancy is reduced.
        - alert: UnboundXiPtrGatewaySocialUnreachable
          expr: min(unbound_gateway_social_alive{namespace="uxi-ptr"}) == 0
          for: 2m
          labels:
            severity: critical
            discord_channel: homelab-alerts
          annotations:
            summary: UnboundXI PTR gateway sees no live social service replica; chat, party, linkshell and social frames are refused.
