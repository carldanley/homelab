---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: uxi-ptr-gateway
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: uxi-ptr-server
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uxi-ptr-server
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        gpu.homelab/amd: 'true'
      containers:
        - name: gateway
          image: git.r1p.dev/unbound-xi/server-gateway:v0.7.0@sha256:2a40ed4c15532d8bc8e8afe2c643b54e3385a1a563105c83426a038d80ab0bf9
          imagePullPolicy: IfNotPresent
          command:
            - unbound-gateway
          args:
            - serve
          env:
            - name: UNBOUND_CONFIG
              value: /config/config.toml
            - name: UNBOUND_LOG_FORMAT
              value: json
            - name: RUST_LOG
              value: info
            - name: UNBOUND_GATEWAY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
          ports:
            - name: client
              containerPort: 21014
              protocol: UDP
            - name: health
              containerPort: 21018
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
              cpu: '2'
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: nats
              mountPath: /secrets/nats
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sleep
                  - '5'
      volumes:
        - name: config
          configMap:
            name: uxi-ptr-gateway-config
        - name: nats
          secret:
            secretName: uxi-ptr-nats
            items:
              - key: NATS_PASSWORD
                path: password
        - name: tls
          secret:
            secretName: wildcard-certificate-tls
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: uxi-ptr-server
                  app.kubernetes.io/component: gateway
              topologyKey: kubernetes.io/hostname
  serviceName: uxi-ptr-gateway-headless
  ordinals:
    start: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  minReadySeconds: 10
