---
apiVersion: v1
kind: Service
metadata:
  name: uxi-ptr-gateway-lan
  annotations:
    lbipam.cilium.io/ips: 10.50.100.7
spec:
  selector:
    app.kubernetes.io/name: uxi-ptr-server
    app.kubernetes.io/component: gateway
  ports:
    - name: client
      port: 21014
      targetPort: client
      protocol: UDP
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    # Public client addresses are preserved through the VPS WireGuard tunnel.
    - 0.0.0.0/0
---
apiVersion: v1
kind: Service
metadata:
  name: uxi-ptr-gateway-headless
spec:
  selector:
    app.kubernetes.io/name: uxi-ptr-server
    app.kubernetes.io/component: gateway
  ports:
    - name: health
      port: 21018
      targetPort: health
  clusterIP: None
