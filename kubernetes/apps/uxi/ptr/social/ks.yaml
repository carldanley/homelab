---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uxi-ptr-social
spec:
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/uxi/ptr/social/app
  prune: true
  wait: true
  dependsOn:
    # The release contract rolls the social service after the state
    # service and before the gateways and workers.
    - name: uxi-ptr-postgres
      namespace: uxi-ptr
    - name: uxi-ptr-api
      namespace: uxi-ptr
    - name: uxi-ptr-state
      namespace: uxi-ptr
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: uxi-ptr
