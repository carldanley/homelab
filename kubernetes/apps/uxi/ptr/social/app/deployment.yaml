---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uxi-ptr-social
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: uxi-ptr-server
      app.kubernetes.io/component: social
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uxi-ptr-server
        app.kubernetes.io/component: social
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Must exceed [social] shutdown_drain_ms (8 s by default).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        gpu.homelab/amd: 'true'
      containers:
        - name: social
          image: git.r1p.dev/unbound-xi/server-social:v0.1.0@sha256:0ffdbe8f06ed75dfcb9b2223f2aec05c0295a0c35c77f7ae3af14405934a4caf
          imagePullPolicy: IfNotPresent
          command:
            - unbound-social
          args:
            - serve
          env:
            - name: UNBOUND_CONFIG
              value: /config/config.toml
            - name: UNBOUND_LOG_FORMAT
              value: json
            - name: RUST_LOG
              value: info
            - name: UNBOUND_DATABASE_SOCIAL_URL
              valueFrom:
                secretKeyRef:
                  name: uxi-ptr-social-postgres
                  key: social-url
          ports:
            - name: health
              containerPort: 21021
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # The icon cache is 64 MiB per replica and the audit buffer
              # holds at most 100,000 rows; 1 Gi leaves headroom for both.
              memory: 1Gi
              cpu: '2'
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: postgres-ca
              mountPath: /postgres-ca
              readOnly: true
            - name: nats
              mountPath: /secrets/nats
              readOnly: true
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: uxi-ptr-social-config
        - name: postgres-ca
          secret:
            secretName: uxi-ptr-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: nats
          secret:
            secretName: uxi-ptr-nats
            items:
              - key: NATS_PASSWORD
                path: password
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: uxi-ptr-server
                  app.kubernetes.io/component: social
              topologyKey: kubernetes.io/hostname
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Five eligible nodes for three replicas: bring the new replica up on
      # a free node before an old one leaves, so the queue group never
      # drops below three during a roll.
      maxSurge: 1
      maxUnavailable: 0
