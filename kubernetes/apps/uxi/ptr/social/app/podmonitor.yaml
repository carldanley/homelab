---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: uxi-ptr-social
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: uxi-ptr-server
      app.kubernetes.io/component: social
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: service
  podTargetLabels:
    - app.kubernetes.io/component
