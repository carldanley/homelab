---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: uxi-ptr-zone-workers
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: uxi-ptr-server
      app.kubernetes.io/component: zone-worker
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: 30s
  podTargetLabels:
    - app.kubernetes.io/component
    - uxi.homelab/zone-group
