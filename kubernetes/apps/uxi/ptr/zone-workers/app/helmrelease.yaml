---
# Each nation's city areas run on one worker. Other zones present in the
# image fall to the claims-all worker (../../map-worker). Jeuno, Valkurm
# Dunes and Qufim Island are absent from the v0.12.0 content index; workers
# configured for those zones refuse to start. Add groups only for zones
# shipped in the image. A map may appear in one group only; a listed map
# is offered only to its group, never to the claims-all worker.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uxi-ptr-zone-workers
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ./kubernetes/apps/uxi/charts/zone-workers
      # Repackage on every commit, not only on a Chart.yaml version bump.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    namePrefix: uxi-ptr-zone
    image: git.r1p.dev/unbound-xi/server-worker:v0.12.0@sha256:e55c999982f0ad8bbfed2bc2b2c3fa3ebf54b3a367a57ed1d8eb3872789bc2cc
    groups:
      # Southern San dOria, Northern San dOria, Port San dOria, Chateau dOraguille
      - name: san-doria
        idBase: 100
        zones: [230, 231, 232, 233]
      # Bastok Mines, Bastok Markets, Port Bastok, Metalworks
      - name: bastok
        idBase: 200
        zones: [234, 235, 236, 237]
      # Windurst Waters, Windurst Walls, Port Windurst, Windurst Woods, Heavens Tower
      - name: windurst
        idBase: 300
        zones: [238, 239, 240, 241, 242]
