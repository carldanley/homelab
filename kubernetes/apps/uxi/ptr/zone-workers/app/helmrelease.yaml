---
# Zone groups for PTR: cities on workers of their own, the field and
# dungeon zones of the base game, Zilart, Promathia and Aht Urhgan grouped
# by region. Everything Wings of the Goddess and later, and the GM and
# residential zones, is unlisted and falls to the claims-all worker
# (../../map-worker). A map may appear in one group only; the chart refuses
# a duplicate idBase, and a listed map is offered only to its group, never
# to the claims-all worker, so an empty group means an ownerless zone.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uxi-ptr-zone-workers
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ./kubernetes/apps/uxi/charts/zone-workers
      # Repackage on every commit, not only on a Chart.yaml version bump.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    namePrefix: uxi-ptr-zone
    image: git.r1p.dev/unbound-xi/server-worker:v0.10.0@sha256:d319b099bf5a7d2ab86f50b98ae7f9e1b7a3189027aba62e440553ec03101a4f
    groups:
      # Southern San dOria
      - name: southern-san-doria
        idBase: 100
        zones: [230]
      # Northern San dOria, Chateau dOraguille
      - name: northern-san-doria
        idBase: 200
        zones: [231, 233]
      # Port San dOria
