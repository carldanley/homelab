---
# Zone groups for PTR, kept small to start: each nation's city areas on
# one worker, Jeuno on one, and the two levelling hot spots, Valkurm Dunes
# and Qufim Island, on a worker each. Everything else is unlisted and falls
# to the claims-all worker (../../map-worker), Aht Urhgan and Limbus among
# it, since neither is accessible on PTR yet. A map may appear in one group
# only; the chart refuses a duplicate idBase, and a listed map is offered
# only to its group, never to the claims-all worker, so an empty group means
# an ownerless zone.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uxi-ptr-zone-workers
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ./kubernetes/apps/uxi/charts/zone-workers
      # Repackage on every commit, not only on a Chart.yaml version bump.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    namePrefix: uxi-ptr-zone
    image: git.r1p.dev/unbound-xi/server-worker:v0.10.0@sha256:d319b099bf5a7d2ab86f50b98ae7f9e1b7a3189027aba62e440553ec03101a4f
    groups:
      # Southern San dOria, Northern San dOria, Port San dOria, Chateau dOraguille
      - name: san-doria
        idBase: 100
        zones: [230, 231, 232, 233]
      # Bastok Mines, Bastok Markets, Port Bastok, Metalworks
      - name: bastok
        idBase: 200
        zones: [234, 235, 236, 237]
      # Windurst Waters, Windurst Walls, Port Windurst, Windurst Woods, Heavens Tower
      - name: windurst
        idBase: 300
        zones: [238, 239, 240, 241, 242]
      # RuLude Gardens, Upper Jeuno, Lower Jeuno, Port Jeuno
      - name: jeuno
        idBase: 400
        zones: [243, 244, 245, 246]
      # Valkurm Dunes
      - name: valkurm-dunes
        idBase: 500
        zones: [103]
      # Qufim Island
      - name: qufim
        idBase: 600
        zones: [126]
