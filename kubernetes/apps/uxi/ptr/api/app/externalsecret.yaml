---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uxi-ptr-api-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: uxi-ptr-api-postgres
    template:
      data:
        account-url: >-
          postgres://uxi_ptr:{{ .UXI_PTR_POSTGRES_PASS | urlquery | replace "+" "%20" }}@uxi-ptr-postgres-rw.uxi-ptr.svc.cluster.local:5432/uxi_ptr?sslmode=verify-full&sslrootcert=/postgres-ca/ca.crt&options=-csearch_path%3Daccount
  dataFrom:
    - extract:
        key: uxi-ptr-postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uxi-ptr-api-discord
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: uxi-ptr-api-discord
  data:
    - secretKey: client-id
      remoteRef:
        key: discord-app-unboundxi-ptr
        property: UNBOUND_API_DISCORD_CLIENT_ID
    - secretKey: client-secret
      remoteRef:
        key: discord-app-unboundxi-ptr
        property: UNBOUND_API_DISCORD_CLIENT_SECRET
    - secretKey: redirect-url
      remoteRef:
        key: discord-app-unboundxi-ptr
        property: UNBOUND_API_DISCORD_REDIRECT_URL
