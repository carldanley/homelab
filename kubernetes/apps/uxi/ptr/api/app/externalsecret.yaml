---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uxi-ptr-api-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: uxi-ptr-api-postgres
    template:
      data:
        account-url: >-
          postgres://uxi_ptr:{{ .UXI_PTR_POSTGRES_PASS | urlquery | replace "+" "%20" }}@uxi-ptr-postgres-rw.uxi-ptr.svc.cluster.local:5432/uxi_ptr?sslmode=verify-full&sslrootcert=/postgres-ca/ca.crt&options=-csearch_path%3Daccount
  dataFrom:
    - extract:
        key: uxi-ptr-postgres
