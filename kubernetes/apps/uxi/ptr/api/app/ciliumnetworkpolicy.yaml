---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: uxi-ptr-api-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: uxi-ptr-server
      app.kubernetes.io/component: api
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: '21014'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '21017'
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
---
# Login with Discord: the API server calls Discord's API, and nothing else
# outside the cluster. The DNS rule lets Cilium learn the name's addresses.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: uxi-ptr-api-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: uxi-ptr-server
      app.kubernetes.io/component: api
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'
    - toFQDNs:
        - matchName: discord.com
        # The cluster resolver follows the search path itself (autopath), so
        # the name the pod is answered under is the namespaced one.
        - matchName: discord.com.uxi-ptr.svc.cluster.local
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
