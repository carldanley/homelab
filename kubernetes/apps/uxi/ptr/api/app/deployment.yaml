---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uxi-ptr-api
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: uxi-ptr-server
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uxi-ptr-server
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        gpu.homelab/amd: 'true'
      containers:
        - name: api
          image: git.r1p.dev/unbound-xi/server-api:v0.5.0@sha256:3050170af2d1bb3ff598b9aef698b6872458dd0c89a52eee8a9227697793c6c4
          imagePullPolicy: IfNotPresent
          command:
            - unbound-api
          args:
            - serve
          env:
            - name: UNBOUND_CONFIG
              value: /config/config.toml
            - name: UNBOUND_LOG_FORMAT
              value: json
            - name: RUST_LOG
              value: info
            - name: UNBOUND_DATABASE_ACCOUNT_URL
              valueFrom:
                secretKeyRef:
                  name: uxi-ptr-api-postgres
                  key: account-url
          ports:
            - name: client
              containerPort: 21014
              protocol: TCP
            - name: health
              containerPort: 21017
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
              cpu: '2'
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: postgres-ca
              mountPath: /postgres-ca
              readOnly: true
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sleep
                  - '5'
      volumes:
        - name: config
          configMap:
            name: uxi-ptr-api-config
        - name: postgres-ca
          secret:
            secretName: uxi-ptr-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: uxi-ptr-server
                  app.kubernetes.io/component: api
              topologyKey: kubernetes.io/hostname
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Three eligible nodes, one API pod per node: free a slot before replacing it.
      maxSurge: 0
      maxUnavailable: 1
