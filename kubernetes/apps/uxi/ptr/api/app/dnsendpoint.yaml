---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: uxi-ptr-api-external
  labels:
    dns.homelab/external: 'true'
spec:
  endpoints:
    - dnsName: api-ptr.${DOMAIN_9}
      recordTTL: 60
      recordType: CNAME
      targets:
        - external.${DOMAIN_9}
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: uxi-ptr-api-internal
  labels:
    dns.homelab/external: 'false'
spec:
  endpoints:
    - dnsName: api-ptr.${DOMAIN_9}
      recordTTL: 60
      recordType: CNAME
      targets:
        - internal.${DOMAIN_9}
