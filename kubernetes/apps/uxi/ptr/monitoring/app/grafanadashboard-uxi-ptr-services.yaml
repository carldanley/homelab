---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Every PTR service on one board: resources against requests and limits,
# the map workers' tick budget, the gateways, the state service, the
# social service and the bus. Edit resources/uxi-ptr-services.json and
# preserve its uid to keep existing dashboard links working.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: uxi-ptr-services
spec:
  uid: uxi-ptr-services
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: grafana-dashboard-uxi-ptr-services
    key: uxi-ptr-services.json
  datasources:
    - datasourceName: Prometheus
      inputName: DS_PROMETHEUS
  # The "Unbound" folder is created and permissioned by grafana-authz-reconciler
  # (observability): team unbound-gms holds view access.
  folderUID: unbound-dashboards
