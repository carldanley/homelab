---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Every PTR service on one board: resources against requests and limits,
# the map workers' tick budget, the gateways, the state service, the
# social service and the bus. Generated JSON; edit the panels here and keep
# the uid, since the Unbound folder's viewing permissions are the folder's.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: uxi-ptr-services
spec:
  uid: uxi-ptr-services
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: Prometheus
      inputName: DS_PROMETHEUS
  # The "Unbound" folder is created and permissioned by grafana-authz-reconciler
  # (observability): team unbound-gms holds view access.
  folderUID: unbound-dashboards
  json: |
    {
      "uid": "uxi-ptr-services",
      "title": "UnboundXI PTR services",
      "tags": [
        "unboundxi",
        "ptr"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "worker",
            "label": "Worker",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "refresh": 2,
            "query": {
              "query": "label_values(unbound_worker_zones{namespace=\"uxi-ptr\"}, pod)",
              "refId": "workers"
            },
            "definition": "label_values(unbound_worker_zones{namespace=\"uxi-ptr\"}, pod)",
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Gateway sessions",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(unbound_gateway_sessions{namespace=\"uxi-ptr\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "description": "Client sessions across the three gateways."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Zones open",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "max(unbound_state_zones_open{namespace=\"uxi-ptr\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Zones ownerless",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "max(unbound_state_zones_ownerless{namespace=\"uxi-ptr\"} - unbound_state_zones_dormant{namespace=\"uxi-ptr\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "description": "Open zone instances with no live owner that are not dormant. A dormant zone was released empty and waits out the eviction delay by design; anything else above zero for long is an alert."
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Workers ready",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "count(unbound_worker_state_ready{namespace=\"uxi-ptr\"} == 1)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "description": "Worker processes connected to the state service, zone groups and the claims-all worker together."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Social link",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "down",
                      "color": "red"
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "alive",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "min(unbound_gateway_social_alive{namespace=\"uxi-ptr\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "description": "Whether every gateway sees a live social replica. Down means chat, party, linkshell and social frames are refused."
        },
        {
          "id": 7,
          "type": "stat",
          "title": "State flush age",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 3
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "max(unbound_state_flush_age_seconds{namespace=\"uxi-ptr\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "description": "Seconds of world state a restart of the state service would lose."
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Restarts (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"uxi-ptr\"}[24h]))",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Bus version refusals (since start)",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum({__name__=~\"unbound_.*_version_refused_total\", namespace=\"uxi-ptr\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "description": "Messages dropped since the pod started because a peer speaks another bus version: a half-rolled set or a stale pod. The counter appears on the first refusal."
        },
        {
          "id": 10,
          "type": "row",
          "title": "Resources",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "CPU by pod (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"uxi-ptr\", container!=\"\", image!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "CPU as a share of request",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": {
                  "mode": "line+area"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"uxi-ptr\", container!=\"\", image!=\"\"}[5m])) / on (pod) sum by (pod) (kube_pod_container_resource_requests{namespace=\"uxi-ptr\", resource=\"cpu\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "description": "No CPU limits are set; a pod sustained above 150% of its request is a sizing signal, which is the alert threshold."
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Memory working set by pod",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"uxi-ptr\", container!=\"\", image!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Memory as a share of limit",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": {
                  "mode": "line+area"
                }
              },
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.85
                  },
                  {
                    "color": "red",
                    "value": 0.95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"uxi-ptr\", container!=\"\", image!=\"\"}) / on (pod) sum by (pod) (kube_pod_container_resource_limits{namespace=\"uxi-ptr\", resource=\"memory\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "description": "Working set against the container's memory limit; 85% warns and 95% is critical."
        },
        {
          "id": 15,
          "type": "row",
          "title": "Map workers",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Tick duration p95 / p99",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": {
                  "mode": "line+area"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.4
                  },
                  {
                    "color": "red",
                    "value": 0.51
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (pod, le) (rate(unbound_worker_tick_duration_seconds_bucket{namespace=\"uxi-ptr\", pod=~\"$worker\"}[5m])))",
              "legendFormat": "p95 {{pod}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (pod, le) (rate(unbound_worker_tick_duration_seconds_bucket{namespace=\"uxi-ptr\", pod=~\"$worker\"}[5m])))",
              "legendFormat": "p99 {{pod}}",
              "refId": "B"
            }
          ],
          "description": "One tick must fit in 0.4 s (REQ-PERF-010); 0.51 s is the p99 tripwire (REQ-PERF-004)."
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Longest tick since start",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": {
                  "mode": "line+area"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.4
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "unbound_worker_tick_seconds_max{namespace=\"uxi-ptr\", pod=~\"$worker\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Zones held per worker",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 31
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "unbound_worker_zones{namespace=\"uxi-ptr\", pod=~\"$worker\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Sessions per worker",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 31
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "unbound_worker_sessions{namespace=\"uxi-ptr\", pod=~\"$worker\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Batch acknowledgement p95",
          "datasource": {
