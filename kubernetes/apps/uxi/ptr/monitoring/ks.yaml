---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uxi-ptr-monitoring
spec:
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/uxi/ptr/monitoring/app
  prune: true
  wait: true
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
    - name: grafana-operator
      namespace: observability
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: uxi-ptr
