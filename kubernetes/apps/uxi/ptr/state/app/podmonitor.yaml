---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: uxi-ptr-state
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: uxi-ptr-server
      app.kubernetes.io/component: state
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: 30s
  podTargetLabels:
    - app.kubernetes.io/component
