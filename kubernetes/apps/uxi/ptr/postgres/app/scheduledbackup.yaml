---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: uxi-ptr-postgres
spec:
  backupOwnerReference: self
  cluster:
    name: uxi-ptr-postgres
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # 04:30 UTC, staggered away from the other clusters' midnight base backups.
  schedule: "0 30 4 * * *"
