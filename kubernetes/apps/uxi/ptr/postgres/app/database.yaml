---
# Manage schemas in the existing PTR database; reuse its owner and credentials.
# Separate schemas keep API and state-service migration histories independent.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: uxi-ptr
spec:
  name: uxi_ptr
  owner: uxi_ptr
  cluster:
    name: uxi-ptr-postgres
  databaseReclaimPolicy: retain
  schemas:
    - name: account
      owner: uxi_ptr
      ensure: present
    - name: world
      owner: uxi_ptr
      ensure: present
