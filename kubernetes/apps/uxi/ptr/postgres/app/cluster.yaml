---
# PTR database: three instances preserve failover testing with smaller allocations.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: uxi-ptr-postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:${POSTGRESQL_VERSION}
  primaryUpdateStrategy: unsupervised
  storage:
    # openebs-hostpath is a directory on each node's dedicated 2 TB NVMe. The
    # size is not enforced by the class, so the real ceiling is the drive.
    size: 50Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: uxi-ptr-postgres-secret
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: uxi_ptr
      owner: uxi_ptr
      secret:
        name: uxi-ptr-postgres-app-secret
      dataChecksums: true
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
  affinity:
    # Three instances on three distinct MS-A2 nodes. Local volumes pin each
    # instance to its node, so streaming replication is the HA.
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: gpu.homelab/amd
                operator: In
                values: ["true"]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["w02", "w03"]
  postgresql:
    shared_preload_libraries:
      - pg_stat_statements
    synchronous:
      # One synchronous standby: a committed economy transaction exists on two
      # nodes. Write-behind checkpoints opt out per transaction with
      # synchronous_commit = off. "preferred" keeps the primary writable if
      # no standby is available.
      method: any
      number: 1
      dataDurability: preferred
    parameters:
      max_connections: "100"
      shared_buffers: 512MB
      effective_cache_size: 1GB
      work_mem: 4MB
      maintenance_work_mem: 128MB
      wal_buffers: 16MB
      min_wal_size: 1GB
      max_wal_size: 2GB
      max_slot_wal_keep_size: 4GB
      checkpoint_timeout: 15min
      checkpoint_completion_target: "0.9"
      wal_compression: lz4
      archive_timeout: 60s
      random_page_cost: "1.1"
      effective_io_concurrency: "256"
      jit: "off"
      track_io_timing: "on"
      log_min_duration_statement: 100ms
      autovacuum_naptime: 15s
      autovacuum_vacuum_scale_factor: "0.05"
      autovacuum_analyze_scale_factor: "0.02"
      pg_stat_statements.track: top
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 2Gi
  monitoring:
    enablePodMonitor: false # see podmonitor.yaml
  managed:
    services:
      additional:
        # LAN access for trusted clients on the home network (the owner's
        # laptop, admin tooling). Cilium announces the address over BGP and
        # external-dns publishes the name in UniFi DNS. Auth is scram-sha-256
        # over the cluster's TLS; nothing here is reachable from the internet.
        - selectorType: rw
          updateStrategy: patch
          serviceTemplate:
            metadata:
              name: uxi-ptr-postgres-lan
              labels:
                # Internal only: external-dns-cloudflare publishes solely
                # resources labeled dns.homelab/external=true, so this name
                # exists in UniFi's LAN DNS and nowhere else.
                dns.homelab/external: "false"
              annotations:
                lbipam.cilium.io/ips: 10.50.100.8
                external-dns.alpha.kubernetes.io/hostname: postgres.ptr.${DOMAIN_9}
            spec:
              type: LoadBalancer
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: uxi-ptr-postgres-r2
        serverName: uxi-ptr-postgres-v1
