---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: uxi-postgres
spec:
  backupOwnerReference: self
  cluster:
    name: uxi-postgres
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # 04:00 UTC, staggered away from the other clusters' midnight base backups.
  schedule: "0 0 4 * * *"
