---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: immich-frames
  labels:
    dns.homelab/external: "false"
spec:
  endpoints:
    - dnsName: "left-frame.${DOMAIN_4}"
      recordTTL: 60
      recordType: CNAME
      targets:
        - "internal.${DOMAIN_4}"
    - dnsName: "right-frame.${DOMAIN_4}"
      recordTTL: 60
      recordType: CNAME
      targets:
        - "internal.${DOMAIN_4}"
