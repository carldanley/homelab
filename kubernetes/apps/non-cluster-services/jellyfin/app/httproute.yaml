---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  annotations:
    gatus.home-operations.com/endpoint: |-
      url: https://jellyfin.${DOMAIN_5}/health
      conditions: ["[STATUS] == 200", "[BODY] == Healthy"]
spec:
  parentRefs:
    - name: jellyfin
      namespace: kube-system
      sectionName: jellyfin-https
    - name: internal
      namespace: kube-system
      sectionName: domain-5-subdomain-https
  hostnames:
    - "jellyfin.${DOMAIN_5}"
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
      timeouts:
        request: 0s
        backendRequest: 0s
