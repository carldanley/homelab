---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: non-cluster-services
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: jellyfin
  dependsOn:
    - name: cilium-gateway
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/non-cluster-services/jellyfin/app
  postBuild:
    substitute:
      JELLYFIN_WAN_IP: "104.6.244.191"
    substituteFrom:
      - kind: Secret
        name: domains-secret
        optional: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: non-cluster-services
  wait: true
