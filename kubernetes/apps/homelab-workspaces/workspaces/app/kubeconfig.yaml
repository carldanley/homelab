---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-kubeconfig
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: homelab-workspace
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: diagnostics
        context:
          cluster: in-cluster
          user: homelab-workspace
          namespace: coder-workspaces
    current-context: diagnostics
