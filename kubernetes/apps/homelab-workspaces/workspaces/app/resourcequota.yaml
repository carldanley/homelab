---
apiVersion: v1
kind: LimitRange
metadata:
  name: homelab-workspaces
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 2Gi
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 8Gi
      min:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 8Gi
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 20Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: homelab-workspaces
spec:
  hard:
    pods: "2"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 16Gi
    persistentvolumeclaims: "2"
    requests.storage: 40Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
