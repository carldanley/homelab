---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: readmeabook-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: readmeabook-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: readmeabook
      ports:
        - protocol: TCP
          port: 6379
