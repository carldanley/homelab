---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readmeabook
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: readmeabook-secret
    template:
      data:
        DATABASE_URL: 'postgresql://readmeabook:{{ .DB_PASSWORD | urlquery }}@postgres-rw.databases.svc.cluster.local:5432/readmeabook'
        CONFIG_ENCRYPTION_KEY: '{{ .CONFIG_ENCRYPTION_KEY }}'
        JWT_SECRET: '{{ .JWT_SECRET }}'
        JWT_REFRESH_SECRET: '{{ .JWT_REFRESH_SECRET }}'
  dataFrom:
    - extract:
        key: readmeabook
---
# Keep PostgreSQL administrator credentials out of the application container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readmeabook-db-init
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: readmeabook-db-init-secret
    template:
      data:
        INIT_POSTGRES_DBNAME: readmeabook
        INIT_POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: readmeabook
        INIT_POSTGRES_PASS: '{{ .DB_PASSWORD }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .POSTGRES_SUPER_PASS }}'
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: readmeabook
