---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr-postgres
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      app:
        type: deployment
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: timescale/timescaledb-ha
              tag: pg18.1-ts2.25.0@sha256:9dcbd18e5cb966398ae19f3882fd5fb2e19b3cb98be54d290ab9f69c75bf0a8b
            env:
              POSTGRES_USER: tracearr
              POSTGRES_DB: tracearr
              PGDATA: /home/postgres/pgdata/data
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tracearr-postgres-secret
                    key: POSTGRES_PASSWORD
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - pg_isready
                    - -U
                    - tracearr
                    - -d
                    - tracearr
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - pg_isready
                    - -U
                    - tracearr
                    - -d
                    - tracearr
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - pg_isready
                    - -U
                    - tracearr
                    - -d
                    - tracearr
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                - ALL
            args:
            - postgres
            - -c
            - timescaledb.license=timescale
            - -c
            - timescaledb.telemetry_level=off
            - -c
            - timescaledb.max_tuples_decompressed_per_dml_transaction=100000
            - -c
            - max_locks_per_transaction=4096
            - -c
            - shared_buffers=128MB
            - -c
            - effective_cache_size=512MB
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - max_wal_size=1GB
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: app
        ports:
          tcp:
            port: 5432
    persistence:
      data:
        existingClaim: tracearr-postgres
        globalMounts:
        - path: /home/postgres/pgdata
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 128Mi
        globalMounts:
        - path: /dev/shm
