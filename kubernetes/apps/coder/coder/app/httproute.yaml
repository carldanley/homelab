---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  annotations:
    gatus.home-operations.com/endpoint: |-
      url: https://coder.${DOMAIN_5}/healthz
      conditions: ["[STATUS] == 200"]
      ui:
        hide-hostname: true
        hide-port: true
        hide-url: true
spec:
  hostnames:
    - "coder.${DOMAIN_5}"
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: domain-5-subdomain-https
  rules:
    - timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: coder
          port: 80
