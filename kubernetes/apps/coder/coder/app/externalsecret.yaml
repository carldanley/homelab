---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: coder-secret
    template:
      data:
        CODER_PG_CONNECTION_URL: 'postgresql://coder:{{ .CODER_POSTGRES_PASS | urlquery | replace "+" "%20" }}@postgres-rw.databases.svc.cluster.local:5432/coder?sslmode=require'
  data:
    - secretKey: CODER_POSTGRES_PASS
      remoteRef:
        key: coder
        property: CODER_POSTGRES_PASS
