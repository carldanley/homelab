---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: coder-secret
    template:
      data:
        CODER_PG_CONNECTION_URL: 'postgresql://coder:{{ .CODER_POSTGRES_PASS | urlquery | replace "+" "%20" }}@postgres-rw.databases.svc.cluster.local:5432/coder?sslmode=require'
        CODER_EXTERNAL_AUTH_0_CLIENT_ID: "{{ .CODER_GITHUB_CLIENT_ID }}"
        CODER_EXTERNAL_AUTH_0_CLIENT_SECRET: "{{ .CODER_GITHUB_CLIENT_SECRET }}"
  data:
    - secretKey: CODER_POSTGRES_PASS
      remoteRef:
        key: coder
        property: CODER_POSTGRES_PASS
    - secretKey: CODER_GITHUB_CLIENT_ID
      remoteRef:
        key: coder-github-oauth
        property: CODER_GITHUB_CLIENT_ID
    - secretKey: CODER_GITHUB_CLIENT_SECRET
      remoteRef:
        key: coder-github-oauth
        property: CODER_GITHUB_CLIENT_SECRET
