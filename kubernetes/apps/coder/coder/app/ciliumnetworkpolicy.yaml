---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coder
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: coder
      app.kubernetes.io/name: coder
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "2112"
              protocol: TCP
