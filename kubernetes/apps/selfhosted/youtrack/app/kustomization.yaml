---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./dnsendpoint.yaml
patches:
  # First installation has no snapshot. After the first verified backup, change
  # Continue to Fail so future restores cannot silently create an empty server.
  - target:
      group: kopiur.home-operations.com
      version: v1alpha1
      kind: Restore
    patch: |-
      - op: replace
        path: /spec/policy/onMissingSnapshot
        value: Continue
      - op: add
        path: /spec/mover
        value:
          podSecurityContext:
            fsGroup: 13001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 13001
            runAsNonRoot: true
            runAsUser: 13001
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 13001
            runAsNonRoot: true
            runAsUser: 13001
            seccompProfile:
              type: RuntimeDefault
  - target:
      group: kopiur.home-operations.com
      version: v1alpha1
      kind: SnapshotPolicy
    patch: |-
      - op: add
        path: /spec/mover
        value:
          inheritSecurityContextFrom:
            pvcConsumer:
              container: app
