---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: youtrack
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      youtrack:
        # The embedded database must have a single writer, including upgrades.
        replicas: 1
        strategy: Recreate
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        initContainers:
          init-directories:
            image: &image
              repository: docker.io/jetbrains/youtrack
              tag: 2026.2.18991@sha256:5830569fc52e6f02211f64411aa436a0769269bc056c7845545e7a6c75888571
            command:
              - /bin/bash
              - -ec
            args:
              - mkdir -p /storage/data /storage/conf /storage/logs /storage/backups
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
          configure-jvm:
            dependsOn: init-directories
            image: *image
            # YouTrack does not consume JAVA_OPTS. Use its supported CLI.
            args:
              - configure
              - --base-url=https://youtrack.${DOMAIN_7}
              - --listen-port=8080
              - -J-Xmx2g
              - -J-XX:MaxMetaspaceSize=512m
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
        containers:
          app:
            image: *image
            env:
              TZ: America/New_York
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                memory: 4Gi
            probes:
              # TCP works during both the first-run wizard and normal service.
              startup:
                enabled: true
                type: TCP
                port: &port 8080
                spec:
                  failureThreshold: 90
                  periodSeconds: 5
                  timeoutSeconds: 3
              readiness:
                enabled: true
                type: TCP
                port: *port
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 3
              liveness:
                enabled: true
                type: TCP
                port: *port
                spec:
                  failureThreshold: 18
                  periodSeconds: 10
                  timeoutSeconds: 3

    defaultPodOptions:
      hostUsers: false
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 13001
        runAsGroup: 13001
        fsGroup: 13001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: youtrack
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "youtrack.${DOMAIN_7}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: domain-7-subdomain-https
          - name: external
            namespace: kube-system
            sectionName: domain-7-subdomain-https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            timeouts:
              # YouTrack live updates use long-lived streaming connections.
              request: 0s
              backendRequest: 0s

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          youtrack:
            init-directories:
              - path: /storage
            configure-jvm: &mounts
              - path: /opt/youtrack/data
                subPath: data
              - path: /opt/youtrack/conf
                subPath: conf
              - path: /opt/youtrack/logs
                subPath: logs
              - path: /opt/youtrack/backups
                subPath: backups
            app: *mounts
