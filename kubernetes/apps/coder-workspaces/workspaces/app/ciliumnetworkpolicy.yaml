---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coder-workspace-control-plane
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace
  egress:
    # Cilium evaluates pod-originated Gateway traffic against the selected
    # backend pod and port. Allow only Coder; its ingress policy requires the
    # HTTPS gateway, so direct workspace-to-control-plane traffic stays denied.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: coder
            k8s:app.kubernetes.io/instance: coder
            k8s:app.kubernetes.io/name: coder
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
