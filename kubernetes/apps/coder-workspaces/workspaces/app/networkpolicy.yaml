---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coder-workspaces
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  # Coder connectivity is allowed separately; Git and build dependencies remain
  # denied until a template-specific policy permits them.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
