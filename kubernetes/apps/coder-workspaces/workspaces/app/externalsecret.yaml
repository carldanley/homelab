---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-code-account-sunday
  namespace: coder-workspaces
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: claude-code-account-sunday
    creationPolicy: Owner
  data:
    - secretKey: oauth-token
      remoteRef:
        key: claude-code-tokens
        property: SUNDAY_CLAUDE_CODE_OAUTH_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-code-account-saturday
  namespace: coder-workspaces
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: claude-code-account-saturday
    creationPolicy: Owner
  data:
    - secretKey: oauth-token
      remoteRef:
        key: claude-code-tokens
        property: SATURDAY_CLAUDE_CODE_OAUTH_TOKEN
