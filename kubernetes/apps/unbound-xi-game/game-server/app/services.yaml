---
apiVersion: v1
kind: Service
metadata:
  name: unbound-game-server
  labels:
    app.kubernetes.io/name: unbound-game-server
    app.kubernetes.io/component: public-zone
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: unbound-game-server
    app.kubernetes.io/component: public-zone
    unbound-xi.dev/serving: "true"
  ports:
    - name: gameplay
      port: 7444
      targetPort: gameplay
      protocol: TCP
    - name: management
      port: 8083
      targetPort: management
      protocol: TCP
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: unbound-private-game-server
  labels:
    app.kubernetes.io/name: unbound-game-server
    app.kubernetes.io/component: private-shard
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: unbound-game-server
    app.kubernetes.io/component: private-shard
    unbound-xi.dev/serving: "true"
  ports:
    - name: gameplay
      port: 7444
      targetPort: gameplay
      protocol: TCP
