---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unbound-game-server
  labels:
    app.kubernetes.io/name: unbound-game-server
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  groups:
    - name: unbound-game-server.rules
      rules:
        - alert: UnboundGameServerUnavailable
          expr: |-
            kube_deployment_status_replicas_available{namespace="unbound-xi-game", deployment="unbound-game-server"} < 1
              or absent(kube_deployment_status_replicas_available{namespace="unbound-xi-game", deployment="unbound-game-server"})
          for: 2m
          labels:
            discord_channel: homelab-alerts
            severity: critical
          annotations:
            summary: The Unbound XI public Game Server is unavailable.
        - alert: UnboundGameServerNotReady
          expr: unbound_game_server_ready{namespace="unbound-xi-game"} == 0
          for: 2m
          labels:
            discord_channel: homelab-alerts
            severity: warning
          annotations:
            summary: The Unbound XI public Game Server is not ready to admit players.
        - alert: UnboundGameServerPersistenceFrozen
          expr: unbound_game_server_persistence_frozen{namespace="unbound-xi-game"} == 1
          for: 1m
          labels:
            discord_channel: homelab-alerts
            severity: critical
          annotations:
            summary: The Unbound XI Game Server has frozen persistence.
        - alert: UnboundGameServerAttachmentRecoveryStuck
          expr: |-
            min_over_time(unbound_game_server_recovering_attachments{namespace="unbound-xi-game"}[10m]) > 0
              or min_over_time(unbound_game_server_reaping_attachments{namespace="unbound-xi-game"}[5m]) > 0
          labels:
            discord_channel: homelab-alerts
            severity: warning
          annotations:
            summary: Unbound XI player attachments are not completing bounded recovery.
