---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unbound-game-server
  labels:
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 30s
  values:
    global:
      labels:
        app.kubernetes.io/part-of: unbound-xi-game
      propagateGlobalMetadataToPods: true

    controllers:
      unbound-game-server:
        replicas: 1
        revisionHistoryLimit: 2
        strategy: Recreate
        labels:
          app.kubernetes.io/component: public-zone
          app.kubernetes.io/version: "${GAME_SERVER_VERSION}"
        annotations:
          configmap.reloader.stakater.com/reload: unbound-game-server-config
          kustomize.toolkit.fluxcd.io/prune: disabled
        pod:
          imagePullSecrets:
            - name: unbound-xi-registry
          labels:
            app.kubernetes.io/component: public-zone
            app.kubernetes.io/version: "${GAME_SERVER_VERSION}"
            unbound-xi.dev/serving: "true"
        containers:
          game-server:
            image:
              repository: git.r1p.dev/unbound-xi/unbound-game-server
              tag: "${GAME_SERVER_VERSION}"
              digest: "${GAME_SERVER_DIGEST}"
              pullPolicy: IfNotPresent
            args:
              - --base-config
              - /etc/unbound-xi/config/base.toml
              - --environment-config
              - /etc/unbound-xi/config/environment.toml
            ports:
              - name: gameplay
                containerPort: 7444
                protocol: TCP
              - name: management
                containerPort: 8083
                protocol: TCP
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: management
                  periodSeconds: 1
                  timeoutSeconds: 1
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: management
                  periodSeconds: 2
                  timeoutSeconds: 1
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: management
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - w01

    persistence:
      configuration:
        type: configMap
        name: unbound-game-server-config
        defaultMode: 0444
        advancedMounts:
          unbound-game-server:
            game-server:
              - path: /etc/unbound-xi/config
                readOnly: true

    service:
      app:
        primary: true
        forceRename: unbound-game-server
        controller: unbound-game-server
        labels:
          app.kubernetes.io/component: public-zone
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        ports:
          gameplay:
            port: 7444
            targetPort: gameplay
          management:
            port: 8083
            targetPort: management
            appProtocol: http
