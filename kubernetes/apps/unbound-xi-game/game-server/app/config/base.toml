schema_version = 1
management_listen_endpoint = "0.0.0.0:8083"
gameplay_listen_endpoint = "0.0.0.0:7444"
tick_rate_hz = 30
shutdown_timeout = "5s"

[internal_api]
host = "unbound-api-game"
port = 8083
request_timeout = "1s"

[coordinator]
host = "unbound-coordinator-worker-control"
port = 7443
request_timeout = "1s"
retry_interval = "500ms"
renew_interval = "1s"
self_fence_timeout = "3s"

[state_owner]
host = "unbound-state-owner-worker"
port = 7451
request_timeout = "1s"
retry_interval = "100ms"
commit_timeout = "3s"
