---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound-game-server
  labels:
    app.kubernetes.io/name: unbound-game-server
    app.kubernetes.io/component: public-zone
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unbound-game-server
      app.kubernetes.io/component: public-zone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unbound-game-server
        app.kubernetes.io/component: public-zone
        app.kubernetes.io/part-of: unbound-xi-game
        unbound-xi.dev/serving: "true"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: unbound-xi-registry
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - w01
      containers:
        - name: game-server
          image: git.r1p.dev/unbound-xi/unbound-game-server:${GAME_SERVER_VERSION}@${GAME_SERVER_DIGEST}
          imagePullPolicy: IfNotPresent
          args:
            - --base-config
            - /etc/unbound-xi/config/base.toml
            - --environment-config
            - /etc/unbound-xi/config/environment.toml
          ports:
            - name: gameplay
              containerPort: 7444
              protocol: TCP
            - name: management
              containerPort: 8083
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: configuration
              mountPath: /etc/unbound-xi/config
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: unbound-game-server-config
            defaultMode: 0444
