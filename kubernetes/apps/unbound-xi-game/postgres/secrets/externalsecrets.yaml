---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unbound-postgres-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unbound-postgres-r2
    template:
      data:
        R2_BUCKET_NAME: "{{ .R2_BUCKET_NAME }}"
        AWS_ACCESS_KEY_ID: "{{ .R2_AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .R2_AWS_SECRET_ACCESS_KEY }}"
