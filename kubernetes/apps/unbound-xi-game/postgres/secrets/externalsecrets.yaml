---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unbound-postgres-superuser
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unbound-postgres-superuser
    template:
      type: kubernetes.io/basic-auth
      data:
        username: postgres
        password: "{{ .POSTGRES_SUPERUSER_PASSWORD }}"
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - extract:
        key: batcave-unbound-xi-game-postgres
