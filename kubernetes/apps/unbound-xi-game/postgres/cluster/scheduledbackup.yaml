---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: unbound-postgres-daily
spec:
  backupOwnerReference: self
  cluster:
    name: unbound-postgres
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "0 30 2 * * *"
