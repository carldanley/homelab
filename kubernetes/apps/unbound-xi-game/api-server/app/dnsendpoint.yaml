---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: unbound-api
  labels:
    app.kubernetes.io/name: unbound-api
    app.kubernetes.io/part-of: unbound-xi-game
    dns.homelab/external: "true"
spec:
  endpoints:
    - dnsName: "api.${DOMAIN_9}"
      recordTTL: 60
      recordType: CNAME
      targets:
        - "external.${DOMAIN_9}"
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: unbound-api-internal
  labels:
    app.kubernetes.io/name: unbound-api
    app.kubernetes.io/part-of: unbound-xi-game
    dns.homelab/external: "false"
spec:
  endpoints:
    - dnsName: "api.${DOMAIN_9}"
      recordTTL: 60
      recordType: CNAME
      targets:
        - "internal.${DOMAIN_9}"
