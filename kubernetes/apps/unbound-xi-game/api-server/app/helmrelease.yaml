---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unbound-api
  labels:
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    global:
      labels:
        app.kubernetes.io/part-of: unbound-xi-game
      propagateGlobalMetadataToPods: true

    controllers:
      unbound-api:
        replicas: 3
        revisionHistoryLimit: 3
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: "0"
          surge: 1
        podDisruptionBudget:
          minAvailable: 2
        labels:
          app.kubernetes.io/component: public-api
          app.kubernetes.io/version: "${API_VERSION}"
        annotations:
          configmap.reloader.stakater.com/reload: unbound-api-config
          secret.reloader.stakater.com/reload: unbound-postgres-application,unbound-api-internal-tls
        pod:
          imagePullSecrets:
            - name: unbound-xi-registry
          labels:
            app.kubernetes.io/component: public-api
            app.kubernetes.io/version: "${API_VERSION}"
            unbound-xi.dev/postgres-client: "true"
        containers:
          api:
            image:
              repository: git.r1p.dev/unbound-xi/unbound-api
              tag: "${API_VERSION}"
              digest: "${API_DIGEST}"
              pullPolicy: IfNotPresent
            args:
              - --base-config
              - /etc/unbound-xi/config/base.toml
              - --environment-config
              - /etc/unbound-xi/config/environment.toml
              - --secret-root
              - /var/run/secrets/unbound-xi
            ports:
              - name: http
                containerPort: 8080
                protocol: TCP
              - name: internal-https
                containerPort: 8443
                protocol: TCP
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: http
                  periodSeconds: 1
                  timeoutSeconds: 1
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: http
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - w01
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: unbound-api
                  app.kubernetes.io/component: public-api
              topologyKey: kubernetes.io/hostname

    persistence:
      configuration:
        type: configMap
        name: unbound-api-config
        defaultMode: 0444
        advancedMounts:
          unbound-api:
            api:
              - path: /etc/unbound-xi/config
                readOnly: true
      database-application-password:
        type: secret
        name: unbound-postgres-application
        defaultMode: 0440
        items:
          - key: password
            path: application-password
            mode: 0440
        advancedMounts:
          unbound-api:
            api:
              - path: /var/run/secrets/unbound-xi/application-password
                subPath: application-password
                readOnly: true
      api-internal-tls:
        type: secret
        name: unbound-api-internal-tls
        defaultMode: 0440
        advancedMounts:
          unbound-api:
            api:
              - path: /var/run/secrets/unbound-xi/api-internal-tls
                readOnly: true

    service:
      app:
        primary: true
        forceRename: unbound-api
        controller: unbound-api
        labels:
          app.kubernetes.io/component: public-api
        ports:
          http:
            port: 8080
            targetPort: http
            appProtocol: http
      internal:
        controller: unbound-api
        labels:
          app.kubernetes.io/component: internal-api
        ports:
          internal-https:
            port: 8443
            targetPort: internal-https
            appProtocol: https

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://api.${DOMAIN_9}/v1/regions
        hostnames:
          - "api.${DOMAIN_9}"
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: domain-9-subdomain-https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /v1
            backendRefs:
              - identifier: app
                port: 8080
