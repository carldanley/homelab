---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unbound-api-default-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unbound-api
      app.kubernetes.io/component: public-api
  policyTypes:
    - Ingress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unbound-api-edge-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unbound-api
      app.kubernetes.io/component: public-api
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unbound-api-gateway-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unbound-api
      app.kubernetes.io/component: public-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: unbound-gateway
      ports:
        - protocol: TCP
          port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unbound-api-game-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unbound-api
      app.kubernetes.io/component: public-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: unbound-game-server
      ports:
        - protocol: TCP
          port: 8083
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unbound-api-private-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unbound-api
      app.kubernetes.io/component: public-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
