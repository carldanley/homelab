schema_version = 1
listen_endpoint = "0.0.0.0:8080"
gateway_internal_listen_endpoint = "0.0.0.0:8082"
game_internal_listen_endpoint = "0.0.0.0:8083"
shutdown_timeout = "10s"
catalog_version = 2
world_catalog_version = 1

[database]
host = "unbound-postgres-rw"
port = 5432
name = "unbound"
user = "unbound_app"
password = { file = "application-password" }
max_connections = 8
acquire_timeout = "2s"

[login]
credential_transport = "external_tls"
password_workers = 2

[admission]
ticket_lifetime = "60s"

[character_creation]
creation_catalog_version = 1
initial_zone_id = "playground"
initial_position = ["-10.0", "0.0", "0.0"]
initial_heading = "0.0"

[region]
region_id = "us-east"
display_name = "US East"

[region.compatibility]
client_contract_min = 1
client_contract_max = 1

[world]
world_id = "unbound-xi"
display_name = "Unbound XI"
