---
apiVersion: batch/v1
kind: Job
metadata:
  name: unbound-database-migrate
  labels:
    app.kubernetes.io/name: unbound-database-migrate
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: unbound-xi-game
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unbound-database-migrate
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: unbound-xi-game
        unbound-xi.dev/postgres-client: "true"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: unbound-xi-registry
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - w01
      containers:
        - name: database-migrate
          image: git.r1p.dev/unbound-xi/unbound-api:${API_VERSION}@${API_DIGEST}
          imagePullPolicy: IfNotPresent
          args:
            - database-migrate
            - --database-host
            - unbound-postgres-rw
            - --database-port
            - "5432"
            - --database-name
            - unbound
            - --database-user
            - unbound_migrator
            - --database-password-file
            - /var/run/secrets/unbound-xi/migrator-password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: database-migrator-password
              mountPath: /var/run/secrets/unbound-xi/migrator-password
              subPath: migrator-password
              readOnly: true
      volumes:
        - name: database-migrator-password
          secret:
            secretName: unbound-postgres-migrator
            defaultMode: 0440
            items:
              - key: password
                path: migrator-password
                mode: 0440
