---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unbound-xi-registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unbound-xi-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"git.r1p.dev":{"username":"{{ .REGISTRY_USERNAME }}","password":"{{ .REGISTRY_TOKEN }}"}}}
  dataFrom:
    - extract:
        key: bug-bounty-registry
