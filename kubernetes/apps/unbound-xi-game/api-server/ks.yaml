---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unbound-api-secrets
  namespace: &namespace unbound-xi-game
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/part-of: unbound-xi-game
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/unbound-xi-game/api-server/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unbound-api-migrate
  namespace: &namespace unbound-xi-game
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/part-of: unbound-xi-game
  dependsOn:
    - name: unbound-api-secrets
      namespace: *namespace
    - name: unbound-postgres
      namespace: *namespace
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: unbound-database-migrate
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/unbound-xi-game/api-server/migration
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: unbound-api-release
        optional: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unbound-api
  namespace: &namespace unbound-xi-game
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/part-of: unbound-xi-game
  dependsOn:
    - name: unbound-api-migrate
      namespace: *namespace
    - name: unbound-api-secrets
      namespace: *namespace
    - name: cilium-gateway
      namespace: kube-system
    - name: kube-prometheus-stack
      namespace: observability
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: unbound-api
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/unbound-xi-game/api-server/app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: unbound-api-release
        optional: false
      - kind: Secret
        name: domains-secret
        optional: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
