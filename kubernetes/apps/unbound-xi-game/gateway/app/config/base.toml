schema_version = 1
listen_endpoint = "0.0.0.0:15420"
management_listen_endpoint = "0.0.0.0:8081"
shutdown_timeout = "5s"
handshake_timeout = "3s"
join_timeout = "5s"
heartbeat_interval = "5s"
idle_timeout = "15s"
zone_recovery_timeout = "30s"
max_pending_handshakes = 64
max_sessions = 256
max_connections_per_source = 8

[server_tls]
certificate = { file = "gateway-tls/gateway-server.pem" }
private_key = { file = "gateway-tls/gateway-server-key.pem" }

[internal_api]
host = "unbound-api-gateway"
port = 8082
request_timeout = "2s"

[coordinator]
host = "unbound-coordinator-route-read"
port = 7442
request_timeout = "1s"

[public_partition]
world_id = "unbound-xi"
partition_id = "playground"

[game_servers.public]
host = "unbound-game-server"
port = 7444

[game_servers.shared_private]
host = "unbound-private-game-server"
port = 7444
