---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: unbound-gateway
  labels:
    app.kubernetes.io/name: unbound-gateway
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unbound-gateway
      app.kubernetes.io/component: edge-gateway
  podMetricsEndpoints:
    - port: management
      path: /metrics
      interval: 30s
      scrapeTimeout: 5s
