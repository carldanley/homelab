---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound-gateway
  labels:
    app.kubernetes.io/name: unbound-gateway
    app.kubernetes.io/component: edge-gateway
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unbound-gateway
      app.kubernetes.io/component: edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unbound-gateway
        app.kubernetes.io/component: edge-gateway
        app.kubernetes.io/part-of: unbound-xi-game
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: unbound-xi-registry
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - w01
      containers:
        - name: gateway
          image: git.r1p.dev/unbound-xi/unbound-gateway:${GATEWAY_VERSION}@${GATEWAY_DIGEST}
          imagePullPolicy: IfNotPresent
          args:
            - --base-config
            - /etc/unbound-xi/config/base.toml
            - --environment-config
            - /etc/unbound-xi/config/environment.toml
            - --secret-root
            - /var/run/secrets/unbound-xi
          ports:
            - name: quic
              containerPort: 15420
              protocol: UDP
            - name: management
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: configuration
              mountPath: /etc/unbound-xi/config
              readOnly: true
            - name: gateway-tls
              mountPath: /var/run/secrets/unbound-xi/gateway-tls/gateway-server.pem
              subPath: gateway-server.pem
              readOnly: true
            - name: gateway-tls
              mountPath: /var/run/secrets/unbound-xi/gateway-tls/gateway-server-key.pem
              subPath: gateway-server-key.pem
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: unbound-gateway-config
            defaultMode: 0444
        - name: gateway-tls
          secret:
            secretName: unbound-gateway-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: gateway-server.pem
                mode: 0440
              - key: tls.key
                path: gateway-server-key.pem
                mode: 0440
