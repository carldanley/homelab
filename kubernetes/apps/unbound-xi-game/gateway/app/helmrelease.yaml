---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unbound-gateway
  labels:
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 30s
  values:
    global:
      labels:
        app.kubernetes.io/part-of: unbound-xi-game
      propagateGlobalMetadataToPods: true

    controllers:
      unbound-gateway:
        replicas: 1
        revisionHistoryLimit: 2
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: "0"
          surge: 1
        labels:
          app.kubernetes.io/component: edge-gateway
          app.kubernetes.io/version: "${GATEWAY_VERSION}"
        annotations:
          configmap.reloader.stakater.com/reload: unbound-gateway-config
          kustomize.toolkit.fluxcd.io/prune: disabled
          secret.reloader.stakater.com/reload: unbound-gateway-tls
        pod:
          imagePullSecrets:
            - name: unbound-xi-registry
          labels:
            app.kubernetes.io/component: edge-gateway
            app.kubernetes.io/version: "${GATEWAY_VERSION}"
        containers:
          gateway:
            image:
              repository: git.r1p.dev/unbound-xi/unbound-gateway
              tag: "${GATEWAY_VERSION}"
              digest: "${GATEWAY_DIGEST}"
              pullPolicy: IfNotPresent
            args:
              - --base-config
              - /etc/unbound-xi/config/base.toml
              - --environment-config
              - /etc/unbound-xi/config/environment.toml
              - --secret-root
              - /var/run/secrets/unbound-xi
            ports:
              - name: quic
                containerPort: 15420
                protocol: UDP
              - name: management
                containerPort: 8081
                protocol: TCP
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: management
                  periodSeconds: 1
                  timeoutSeconds: 1
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: management
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: management
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            resources:
              requests:
                cpu: "1"
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - w01

    persistence:
      configuration:
        type: configMap
        name: unbound-gateway-config
        defaultMode: 0444
        advancedMounts:
          unbound-gateway:
            gateway:
              - path: /etc/unbound-xi/config
                readOnly: true
      gateway-tls:
        type: secret
        name: unbound-gateway-tls
        defaultMode: 0440
        items:
          - key: tls.crt
            path: gateway-server.pem
            mode: 0440
          - key: tls.key
            path: gateway-server-key.pem
            mode: 0440
        advancedMounts:
          unbound-gateway:
            gateway:
              - path: /var/run/secrets/unbound-xi/gateway-tls/gateway-server.pem
                subPath: gateway-server.pem
                readOnly: true
              - path: /var/run/secrets/unbound-xi/gateway-tls/gateway-server-key.pem
                subPath: gateway-server-key.pem
                readOnly: true

    service:
      app:
        primary: true
        forceRename: unbound-gateway
        controller: unbound-gateway
        type: LoadBalancer
        labels:
          app.kubernetes.io/component: edge-gateway
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
          lbipam.cilium.io/ips: "10.50.100.6"
        ports:
          quic:
            port: 15420
            targetPort: quic
            protocol: UDP
      management:
        forceRename: unbound-gateway-management
        controller: unbound-gateway
        labels:
          app.kubernetes.io/component: management-observation
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        ports:
          management:
            port: 8081
            targetPort: management
            protocol: TCP
