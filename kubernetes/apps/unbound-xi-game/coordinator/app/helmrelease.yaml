---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unbound-coordinator
  labels:
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 30s
  values:
    global:
      labels:
        app.kubernetes.io/part-of: unbound-xi-game
      propagateGlobalMetadataToPods: true

    controllers:
      unbound-coordinator:
        replicas: 1
        revisionHistoryLimit: 2
        strategy: Recreate
        labels:
          app.kubernetes.io/component: world-control-plane
          app.kubernetes.io/version: "${COORDINATOR_VERSION}"
        annotations:
          configmap.reloader.stakater.com/reload: unbound-coordinator-config
          kustomize.toolkit.fluxcd.io/prune: disabled
        pod:
          imagePullSecrets:
            - name: unbound-xi-registry
          labels:
            app.kubernetes.io/component: world-control-plane
            app.kubernetes.io/version: "${COORDINATOR_VERSION}"
        containers:
          coordinator:
            image:
              repository: git.r1p.dev/unbound-xi/unbound-coordinator
              tag: "${COORDINATOR_VERSION}"
              digest: "${COORDINATOR_DIGEST}"
              pullPolicy: IfNotPresent
            args:
              - --base-config
              - /etc/unbound-xi/config/base.toml
              - --environment-config
              - /etc/unbound-xi/config/environment.toml
            ports:
              - name: worker-control
                containerPort: 7443
                protocol: TCP
              - name: route-read
                containerPort: 7442
                protocol: TCP
              - name: management
                containerPort: 8082
                protocol: TCP
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: management
                  periodSeconds: 1
                  timeoutSeconds: 1
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: management
                  periodSeconds: 2
                  timeoutSeconds: 1
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: management
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - w01

    persistence:
      configuration:
        type: configMap
        name: unbound-coordinator-config
        defaultMode: 0444
        advancedMounts:
          unbound-coordinator:
            coordinator:
              - path: /etc/unbound-xi/config
                readOnly: true

    service:
      management:
        primary: true
        forceRename: unbound-coordinator
        controller: unbound-coordinator
        labels:
          app.kubernetes.io/component: world-control-plane
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        ports:
          management:
            port: 8082
            targetPort: management
            appProtocol: http
      worker-control:
        forceRename: unbound-coordinator-worker-control
        controller: unbound-coordinator
        labels:
          app.kubernetes.io/component: worker-control
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        ports:
          worker-control:
            port: 7443
            targetPort: worker-control
            appProtocol: http
      route-read:
        forceRename: unbound-coordinator-route-read
        controller: unbound-coordinator
        labels:
          app.kubernetes.io/component: route-read
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        ports:
          route-read:
            port: 7442
            targetPort: route-read
            appProtocol: http
