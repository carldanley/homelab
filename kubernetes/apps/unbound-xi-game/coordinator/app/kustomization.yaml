# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./services.yaml
  - ./networkpolicy.yaml
  - ./podmonitor.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: unbound-coordinator-config
    files:
      - base.toml=./config/base.toml
      - environment.toml=./config/environment.toml
generatorOptions:
  labels:
    app.kubernetes.io/name: unbound-coordinator
    app.kubernetes.io/part-of: unbound-xi-game
