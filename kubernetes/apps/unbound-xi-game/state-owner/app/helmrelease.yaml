---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unbound-state-owner
  labels:
    app.kubernetes.io/part-of: unbound-xi-game
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 30s
  values:
    global:
      labels:
        app.kubernetes.io/part-of: unbound-xi-game
      propagateGlobalMetadataToPods: true

    controllers:
      unbound-state-owner:
        replicas: 1
        revisionHistoryLimit: 2
        strategy: Recreate
        labels:
          app.kubernetes.io/component: zone-state-owner
          app.kubernetes.io/version: "${STATE_OWNER_VERSION}"
        annotations:
          configmap.reloader.stakater.com/reload: unbound-state-owner-config
          kustomize.toolkit.fluxcd.io/prune: disabled
          secret.reloader.stakater.com/reload: unbound-postgres-state-owner
        pod:
          imagePullSecrets:
            - name: unbound-xi-registry
          labels:
            app.kubernetes.io/component: zone-state-owner
            app.kubernetes.io/version: "${STATE_OWNER_VERSION}"
            unbound-xi.dev/postgres-client: "true"
          annotations:
            unbound-xi.dev/state-owner-config-revision: "${STATE_OWNER_CONFIG_REVISION}"
        containers:
          state-owner:
            image:
              repository: git.r1p.dev/unbound-xi/unbound-state-owner
              tag: "${STATE_OWNER_VERSION}"
              digest: "${STATE_OWNER_DIGEST}"
              pullPolicy: IfNotPresent
            args:
              - --base-config
              - /etc/unbound-xi/config/base.toml
              - --environment-config
              - /etc/unbound-xi/config/environment.toml
              - --secret-root
              - /var/run/secrets/unbound-xi
            ports:
              - name: lease-control
                containerPort: 7450
                protocol: TCP
              - name: worker
                containerPort: 7451
                protocol: TCP
              - name: lifecycle
                containerPort: 7452
                protocol: TCP
              - name: management
                containerPort: 8083
                protocol: TCP
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: management
                  periodSeconds: 1
                  timeoutSeconds: 1
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: management
                  periodSeconds: 2
                  timeoutSeconds: 1
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: management
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 192Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - w01

    persistence:
      configuration:
        type: configMap
        name: unbound-state-owner-config
        defaultMode: 0444
        advancedMounts:
          unbound-state-owner:
            state-owner:
              - path: /etc/unbound-xi/config
                readOnly: true
      database-password:
        type: secret
        name: unbound-postgres-state-owner
        defaultMode: 0440
        items:
          - key: password
            path: state-owner-password
            mode: 0440
        advancedMounts:
          unbound-state-owner:
            state-owner:
              - path: /var/run/secrets/unbound-xi/state-owner-password
                subPath: state-owner-password
                readOnly: true

    service:
      lease-control:
        primary: true
        forceRename: unbound-state-owner-lease-control
        controller: unbound-state-owner
        labels:
          app.kubernetes.io/component: lease-control
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        ports:
          lease-control:
            port: 7450
            targetPort: lease-control
            appProtocol: http
      worker:
        forceRename: unbound-state-owner-worker
        controller: unbound-state-owner
        labels:
          app.kubernetes.io/component: worker-state
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        ports:
          worker:
            port: 7451
            targetPort: worker
      lifecycle:
        forceRename: unbound-state-owner-lifecycle
        controller: unbound-state-owner
        labels:
          app.kubernetes.io/component: instance-lifecycle
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        ports:
          lifecycle:
            port: 7452
            targetPort: lifecycle
            appProtocol: http
      management:
        forceRename: unbound-state-owner-management
        controller: unbound-state-owner
        labels:
          app.kubernetes.io/component: management-observation
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        ports:
          management:
            port: 8083
            targetPort: management
            protocol: TCP
