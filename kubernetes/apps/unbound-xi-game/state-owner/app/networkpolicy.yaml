---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unbound-state-owner-lease-control-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unbound-state-owner
      app.kubernetes.io/component: zone-state-owner
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: unbound-coordinator
      ports:
        - protocol: TCP
          port: 7450
---
apiVersion: networking.k8s.io/v1
