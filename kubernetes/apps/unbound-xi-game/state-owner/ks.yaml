---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unbound-state-owner-config
  namespace: &namespace unbound-xi-game
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/part-of: unbound-xi-game
  interval: 1h
  path: ./kubernetes/apps/unbound-xi-game/state-owner/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unbound-state-initialize
  namespace: &namespace unbound-xi-game
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/part-of: unbound-xi-game
  dependsOn:
    - name: unbound-api-migrate
      namespace: *namespace
    - name: unbound-api-secrets
      namespace: *namespace
    - name: unbound-postgres
      namespace: *namespace
    - name: unbound-state-owner-config
      namespace: *namespace
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: unbound-state-initialize
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/unbound-xi-game/state-owner/initialization
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: unbound-state-owner-release
        optional: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unbound-state-owner
  namespace: &namespace unbound-xi-game
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/part-of: unbound-xi-game
  dependsOn:
    - name: unbound-api-secrets
      namespace: *namespace
    - name: unbound-state-initialize
      namespace: *namespace
    - name: unbound-state-owner-config
      namespace: *namespace
    - name: kube-prometheus-stack
      namespace: observability
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: unbound-state-owner
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/unbound-xi-game/state-owner/app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: unbound-state-owner-release
        optional: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
