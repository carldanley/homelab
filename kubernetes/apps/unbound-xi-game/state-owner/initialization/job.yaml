---
apiVersion: batch/v1
kind: Job
metadata:
  name: unbound-state-initialize
  labels:
    app.kubernetes.io/name: unbound-state-initialize
    app.kubernetes.io/component: state-initialization
    app.kubernetes.io/part-of: unbound-xi-game
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unbound-state-initialize
        app.kubernetes.io/component: state-initialization
        app.kubernetes.io/part-of: unbound-xi-game
        unbound-xi.dev/postgres-client: "true"
      annotations:
        unbound-xi.dev/state-owner-config-revision: "${STATE_OWNER_CONFIG_REVISION}"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: unbound-xi-registry
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - w01
      containers:
        - name: state-initialize
          image: git.r1p.dev/unbound-xi/unbound-state-owner:${STATE_OWNER_VERSION}@${STATE_OWNER_DIGEST}
          imagePullPolicy: IfNotPresent
          args:
            - state-initialize
            - --base-config
            - /etc/unbound-xi/config/base.toml
            - --environment-config
            - /etc/unbound-xi/config/environment.toml
            - --secret-root
            - /var/run/secrets/unbound-xi
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: configuration
              mountPath: /etc/unbound-xi/config
              readOnly: true
            - name: database-password
              mountPath: /var/run/secrets/unbound-xi/state-owner-password
              subPath: state-owner-password
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: unbound-state-owner-config
            defaultMode: 0444
        - name: database-password
          secret:
            secretName: unbound-postgres-state-owner
            defaultMode: 0440
            items:
              - key: password
                path: state-owner-password
                mode: 0440
